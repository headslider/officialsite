name: Deploy officialsite to CORESERVER

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "本番へ反映する場合は true。false の場合は dry-run のみ。"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: officialsite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dry-run deploy by FTPS
        if: ${{ github.event.inputs.apply != 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CORESERVER_FTP_SERVER }}
          username: ${{ secrets.CORESERVER_FTP_USERNAME }}
          password: ${{ secrets.CORESERVER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.CORESERVER_FTP_SERVER_DIR }}
          dry-run: true
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            DEPLOY.md
            README.md
            HANDOVER.md
            officialsite_handover.md
            _spam_protection_readme.txt
            _future_yakyu_yarouze_work_card_snippet.html
            _restore_yakyu_yarouze_memo.txt
            assets_manifest.json
            **/*.zip
            **/*.bak
            **/*.tmp
            desktop.ini
            contact_guard/*.log
            contact_guard/*.json
            contact_guard/*.lock
            baseball/**
            baseball_test/**

      - name: Apply deploy by FTPS
        if: ${{ github.event.inputs.apply == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.CORESERVER_FTP_SERVER }}
          username: ${{ secrets.CORESERVER_FTP_USERNAME }}
          password: ${{ secrets.CORESERVER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.CORESERVER_FTP_SERVER_DIR }}
          dry-run: false
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            DEPLOY.md
            README.md
            HANDOVER.md
            officialsite_handover.md
            _spam_protection_readme.txt
            _future_yakyu_yarouze_work_card_snippet.html
            _restore_yakyu_yarouze_memo.txt
            assets_manifest.json
            **/*.zip
            **/*.bak
            **/*.tmp
            desktop.ini
            contact_guard/*.log
            contact_guard/*.json
            contact_guard/*.lock
            baseball/**
            baseball_test/**

      - name: Post deploy note
        if: ${{ github.event.inputs.apply == 'true' }}
        run: |
          echo "Deploy finished. Check https://www.realemotionfactory.com/ and contact form manually."